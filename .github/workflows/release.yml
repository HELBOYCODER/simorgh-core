name: release

# Push a tag like `v0.2.0` and every download people need lands on the
# GitHub Releases page: the desktop app for Windows, Linux and macOS, the
# Android APKs, and Zray Core, the command line engine on its own. Running it by hand builds the same files as workflow
# artifacts without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish as this tag (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  # The version the apps report and compare with the latest release for
  # their in-app updates. Empty for a build-only run, which then reports
  # the crate version and never checks.
  ZERONET_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release -p zeronet-tui
      - run: cargo build --release -p zray-cli
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, pkg | Out-Null
          Copy-Item target/release/zeronet-tui.exe pkg/ZeroNet.exe
          # TUN mode on Windows needs WireGuard's Wintun driver next to the
          # executable. Its prebuilt, signed DLL may be redistributed as is.
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun/wintun/bin/amd64/wintun.dll pkg/
          Copy-Item wintun/wintun/LICENSE.txt pkg/wintun-LICENSE.txt
          Compress-Archive -Path pkg/* -DestinationPath dist/ZeroNet-Windows-x64.zip
          Copy-Item target/release/zeronet-tui.exe dist/ZeroNet-Windows-x64.exe
          # Zray Core: the engine without the app.
          New-Item -ItemType Directory -Force core | Out-Null
          Copy-Item target/release/zray.exe core/
          Copy-Item LICENSE core/
          Compress-Archive -Path core/* -DestinationPath dist/ZrayCore-Windows-x64.zip
          Copy-Item target/release/zray.exe dist/ZrayCore-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        # `label` names the downloads. "x64" and "ARM64" rather than the
        # kernel's x86_64/aarch64: people picked the ARM file on ordinary
        # PCs and got "exec format error". The same words as the Windows
        # download, and what the in-app updater looks for (update.rs).
        include:
          - arch: x86_64
            label: x64
            runner: ubuntu-22.04
          - arch: aarch64
            label: ARM64
            runner: ubuntu-22.04-arm
    # The oldest supported runner: glibc is forward compatible only, so
    # building here keeps the binary running on older distributions.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release -p zeronet-tui
      - run: cargo build --release -p zray-cli
      - name: AppImage and tarball
        env:
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p dist
          app=ZeroNet.AppDir
          install -Dm755 target/release/zeronet-tui "$app/usr/bin/zeronet-tui"
          install -Dm644 packaging/linux/zeronet.desktop "$app/zeronet.desktop"
          install -Dm644 packaging/icons/zeronet.png "$app/zeronet.png"
          install -Dm644 packaging/icons/zeronet.png "$app/usr/share/icons/hicolor/512x512/apps/zeronet.png"
          ln -s usr/bin/zeronet-tui "$app/AppRun"
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool
          ./appimagetool --no-appstream "$app" "dist/ZeroNet-Linux-${LABEL}.AppImage"

          # The bare program, which a non-AppImage install updates itself
          # from.
          install -m755 target/release/zeronet-tui "dist/ZeroNet-Linux-${LABEL}"

          # The plain binary, with the desktop entry and icon, for people
          # who prefer to install it themselves. A tarball keeps the
          # executable bit that a browser download would drop.
          pkg="ZeroNet-Linux-${LABEL}"
          mkdir -p "$pkg"
          cp target/release/zeronet-tui packaging/linux/zeronet.desktop packaging/icons/zeronet.png "$pkg/"
          tar -czf "dist/$pkg.tar.gz" "$pkg"

          # Zray Core: the engine without the app, as a tarball and bare.
          core="ZrayCore-Linux-${LABEL}"
          mkdir -p "$core"
          cp target/release/zray LICENSE "$core/"
          tar -czf "dist/$core.tar.gz" "$core"
          install -m755 target/release/zray "dist/$core"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.label }}
          path: dist/*

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: |
          cargo build --release -p zeronet-tui --target aarch64-apple-darwin
          cargo build --release -p zeronet-tui --target x86_64-apple-darwin
          cargo build --release -p zray-cli --target aarch64-apple-darwin
          cargo build --release -p zray-cli --target x86_64-apple-darwin
      - name: app bundle
        run: |
          version="${RELEASE_TAG#v}"
          [[ -n "$version" ]] || version=0.0.0
          app=dist/ZeroNet.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/zeronet-tui" \
            target/aarch64-apple-darwin/release/zeronet-tui \
            target/x86_64-apple-darwin/release/zeronet-tui
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp packaging/icons/zeronet.icns "$app/Contents/Resources/zeronet.icns"
          # Ad-hoc signature: Apple Silicon refuses to run unsigned code.
          codesign --force --deep --sign - "$app"
          # The bare program, signed, which an installed copy updates itself
          # from (it re-seals its own bundle afterwards).
          cp "$app/Contents/MacOS/zeronet-tui" dist/ZeroNet-macOS-universal
          (cd dist && ditto -c -k --keepParent ZeroNet.app ZeroNet-macOS-universal.zip)
          rm -rf "$app"
          # Zray Core: the engine without the app. A tarball keeps the
          # executable bit; the ad-hoc signature is what Apple Silicon needs.
          core=ZrayCore-macOS-universal
          mkdir -p "$core"
          lipo -create -output "$core/zray" \
            target/aarch64-apple-darwin/release/zray \
            target/x86_64-apple-darwin/release/zray
          codesign --force --sign - "$core/zray"
          cp LICENSE "$core/"
          tar -czf "dist/$core.tar.gz" "$core"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    name: publish release
    # A pushed tag, or a manual run given a version: the release action then
    # creates the tag on this commit.
    if: github.ref_type == 'tag' || inputs.version != ''
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ZeroNet ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## دانلود / Download

            | | Download this | |
            |---|---|---|
            | 🪟 Windows | `ZeroNet-Windows-x64.zip` | Extract, double-click `ZeroNet.exe` |
            | 🐧 Linux, most computers (Intel / AMD) | `ZeroNet-Linux-x64.AppImage` | Make it executable, double-click |
            | 🐧 Linux on ARM (Raspberry Pi, ARM laptops) | `ZeroNet-Linux-ARM64.AppImage` | Make it executable, double-click |
            | 🍎 macOS (Intel and Apple Silicon) | `ZeroNet-macOS-universal.zip` | Unzip, right-click `ZeroNet.app` → Open |
            
            **Zray Core** is the same engine without the app, a command-line program for servers, routers and scripts (`zray run config.json`):

            | | Download this |
            |---|---|
            | 🪟 Windows | `ZrayCore-Windows-x64.zip` |
            | 🐧 Linux, Intel / AMD | `ZrayCore-Linux-x64.tar.gz` |
            | 🐧 Linux on ARM | `ZrayCore-Linux-ARM64.tar.gz` |
            | 🍎 macOS (Intel and Apple Silicon) | `ZrayCore-macOS-universal.tar.gz` |

            **Not sure which Linux file?** Run `uname -m` in a terminal: `x86_64` → **x64**, `aarch64` → **ARM64**. "exec format error" means the other one.
            The other files are for the in-app updater and for experts: the bare programs, `.tar.gz` archives.

            **نمیدونی کدوم فایل لینوکس رو بگیری؟** توی ترمینال `uname -m` رو بزن : `x86_64` یعنی **x64** و `aarch64` یعنی **ARM64** . اگه ارور «exec format error» گرفتی یعنی باید اون یکی رو بگیری . برای اندروید هم اگه مطمئن نیستی `universal` رو نصب کن .

            **زری کور** همون موتور بدون اپه ، یه برنامه ی خط فرمان برای سرور و روتر و اسکریپت (`zray run config.json`) . فایل هاش بالا توی جدول Zray Core هستن .

            راهنمای کامل فارسی توی [README](https://github.com/${{ github.repository }}#readme) هست.
